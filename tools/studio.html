<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eternal Void Studio</title>
<style>
:root {
  --void: #05060a; --panel: rgba(12, 14, 24, 0.94); --line: rgba(148, 163, 214, 0.18);
  --ink: #e6e9f5; --muted: #8d95b3; --accent: #8b9cff; --accent-ink: #0b0e1a; --warn: #f6b35c; --good: #6ee7b7;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--void); color: var(--ink); font: 13px/1.4 "Segoe UI", system-ui, sans-serif; display: flex; overflow: hidden; }
[hidden] { display: none !important; }
#stage { flex: 1; min-width: 0; border: 0; background: #000; }
#drawer { width: 380px; flex: none; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 14px 16px 90px; }
h1 { font-size: 15px; letter-spacing: .12em; margin: 0 0 2px; }
.sub { color: var(--muted); font-size: 11px; margin: 0 0 12px; }
select, input[type=number], input[type=text], textarea { width: 100%; background: #10121c; color: var(--ink); border: 1px solid var(--line); border-radius: 7px; padding: 7px 8px; font: inherit; }
textarea { resize: vertical; min-height: 44px; }
section { border-top: 1px solid var(--line); padding: 10px 0 4px; }
section > h2 { font: 600 10px/1 var(--mono); letter-spacing: .14em; color: var(--muted); text-transform: uppercase; margin: 2px 0 8px; }
.row { display: grid; grid-template-columns: 1fr 74px; gap: 4px 8px; align-items: center; margin-bottom: 8px; }
.row label { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; }
.row label .was { color: var(--muted); font: 10px var(--mono); }
.row.changed label { color: var(--warn); }
.row input[type=range] { grid-column: 1; width: 100%; accent-color: var(--accent); }
.row input[type=number] { grid-column: 2; grid-row: 1 / span 2; padding: 5px 6px; font: 12px var(--mono); }
.check { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; }
.check.changed { color: var(--warn); }
.colors { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.colors input[type=color] { width: 34px; height: 28px; border: 1px solid var(--line); border-radius: 6px; background: none; padding: 0; }
.colors.changed { outline: 1px solid var(--warn); outline-offset: 3px; border-radius: 6px; }
button { background: #ffffff0d; color: var(--ink); border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; font: inherit; cursor: pointer; }
button:hover { background: #ffffff18; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button:disabled { opacity: .45; cursor: default; }
.small { font-size: 11px; padding: 4px 8px; }
.hint { color: var(--muted); font-size: 11px; margin: 4px 0 8px; }
#footer { position: fixed; right: 0; bottom: 0; width: 380px; background: #0b0d16; border-top: 1px solid var(--line); border-left: 1px solid var(--line); padding: 10px 16px; display: grid; gap: 6px; }
#status { font-size: 11px; color: var(--muted); min-height: 15px; word-break: break-word; }
#status a { color: var(--good); }
.bar { display: flex; gap: 8px; }
.bar > * { flex: 1; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<iframe id="stage" src="/index.html?studio=1" title="Live preview of the site"></iframe>
<aside id="drawer" aria-label="Studio controls">
  <h1>ETERNAL VOID STUDIO</h1>
  <p class="sub" id="branch">Loading…</p>
  <label for="preset">Preset</label>
  <select id="preset"></select>
  <p class="hint">Values apply to the preview instantly. Changed values turn amber; Save opens a pull request with only those.</p>
  <div class="bar"><button id="site-ui" class="small">Show site controls</button><button id="reload" class="small">Reload preview</button></div>
  <div id="fields"></div>
  <section id="music-section">
    <h2>Music reaction</h2>
    <p class="hint">Start music in the preview (♫ in the site controls) to see these. Shared by every preset with this scene's shape.</p>
    <div id="music"></div>
    <div class="bar"><select id="music-add" aria-label="Add a music voice"></select><button id="music-add-btn" class="small">Add</button></div>
  </section>
</aside>
<div id="footer">
  <label for="note" class="hint" style="margin:0">Note for the pull request (optional)</label>
  <input id="note" type="text" maxlength="300" autocomplete="off">
  <div class="bar"><button id="reset">Reset preset</button><button id="save" class="primary" disabled>Save as pull request</button></div>
  <div id="status" role="status" aria-live="polite"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const stage = $('stage');
let state, key, original, current, musicOriginal, musicCurrent, musicShape;

// Preset fields map to these simulation settings.
const ALIAS = { size: 'baseSize', sizeVar: 'sizeVariation', curl: 'flowOrganic' };
// min, max, step, log scale. Speed and dissipation are logarithmic for fine low-end control.
const RANGES = {
  speed: [0.01, 8, 0.001, true], turbulence: [0, 3, 0.01], curl: [0, 2, 0.01], density: [100, 8000, 10],
  dissipation: [0.001, 0.4, 0.0001, true], zoom: [0.1, 4, 0.01], size: [0.1, 14, 0.05], sizeVar: [0, 7, 0.05],
  stretch: [0, 8, 0.05], interaction: [0, 3, 0.01], mouseInfluence: [0, 6, 0.05], rotationSpeed: [0, 1.2, 0.005],
  wobble: [0, 1.5, 0.005], drag: [0.8, 0.99, 0.001], kaleidoscopeSegments: [3, 12, 1], miniSpiralCount: [4, 8, 1],
  spiralExtent: [0.45, 0.98, 0.01], wanderMix: [0.05, 0.4, 0.01], eclipseCount: [12, 90, 1], eclipseSize: [0.45, 1.6, 0.01],
  vortexHole: [0.005, 0.2, 0.001], blackHoleSize: [0.01, 0.25, 0.001]
};
const GROUPS = [
  ['Motion', ['speed', 'turbulence', 'curl', 'rotationSpeed', 'wobble', 'drag']],
  ['Particles', ['size', 'sizeVar', 'stretch', 'density', 'dissipation', 'zoom', 'interaction', 'mouseInfluence']],
  ['Kaleidoscope', ['kaleidoscopeEnabled', 'kaleidoscopeSegments', 'spinningKaleido']],
  ['Effects', ['psychedelicMode', 'morphingBg', 'particleLighting']],
];
const SKIP = new Set(['name', 'desc', 'addedOn', 'colors', 'particleShape', 'meditationPreset', 'bilateralEnabled', 'asmrEnabled', 'binauralMode']);
const LIGHTING = ['glow', 'reactive', 'pearl', 'metal'];

const win = () => stage.contentWindow;
const sim = () => win()?.simInstance;
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const status = (html) => { $('status').innerHTML = html; };

async function api(path, body) {
  const res = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

// ---------- preview ----------
let siteUiVisible = false;
function prepareStage() {
  const doc = stage.contentDocument;
  if (!doc) return;
  [...doc.querySelectorAll('button')].find(b => /^enter the void$/i.test(b.textContent.trim()))?.click();
  if (!doc.getElementById('studio-hide')) {
    const style = doc.createElement('style');
    style.id = 'studio-hide';
    style.textContent = '#control-panel, .hud, header, .top-bar, .flow-status-banner, .toast { display: none !important; }';
    doc.head.appendChild(style);
  }
  doc.getElementById('studio-hide').disabled = siteUiVisible;
  setTimeout(() => selectInStage(key), 600);
}
function selectInStage(presetKey) {
  const doc = stage.contentDocument;
  const row = doc?.querySelector(`[data-preset="${presetKey}"]`);
  if (row && !row.classList.contains('active')) row.querySelector('.preset-load')?.click();
}
// Keep the preview on the Studio's values even while the site morphs or Flow runs.
function pinValues() {
  const s = sim();
  if (s && current) {
    for (const [field, value] of Object.entries(current)) {
      if (field === 'colors' || SKIP.has(field)) continue;
      s.settings[ALIAS[field] || field] = value;
    }
    if (current.colors && !same(s.palette, current.colors)) s.updatePalette([...current.colors]);
    if (current.particleShape) s.settings.particleShape = current.particleShape;
  }
  requestAnimationFrame(pinValues);
}
stage.addEventListener('load', () => setTimeout(prepareStage, 400));
$('site-ui').onclick = () => {
  siteUiVisible = !siteUiVisible;
  const sheet = stage.contentDocument?.getElementById('studio-hide');
  if (sheet) sheet.disabled = siteUiVisible;
  $('site-ui').textContent = siteUiVisible ? 'Hide site controls' : 'Show site controls';
};
$('reload').onclick = () => { stage.contentWindow.location.reload(); };

// ---------- controls ----------
const toSlider = (v, [min, max, , log]) => log ? Math.log(v / min) / Math.log(max / min) * 1000 : v;
const fromSlider = (t, [min, max, step, log]) => {
  const v = log ? min * Math.pow(max / min, t / 1000) : t;
  return Math.round(v / step) * step;
};
const clean = n => Math.round(n * 10000) / 10000;

function numberRow(field) {
  const value = current[field];
  const range = RANGES[field] || [0, Math.max(1, Math.abs(value) * 3), 0.01];
  const row = document.createElement('div');
  row.className = 'row';
  const label = document.createElement('label');
  const name = document.createElement('span');
  const was = document.createElement('span');
  name.textContent = field;
  was.className = 'was';
  label.append(name, was);
  const slider = document.createElement('input');
  slider.type = 'range';
  slider.setAttribute('aria-label', field);
  if (range[3]) { slider.min = 0; slider.max = 1000; slider.step = 1; }
  else { slider.min = range[0]; slider.max = range[1]; slider.step = range[2]; }
  const box = document.createElement('input');
  box.type = 'number';
  box.step = range[2];
  box.setAttribute('aria-label', `${field} value`);
  const show = () => {
    slider.value = toSlider(current[field], range);
    box.value = clean(current[field]);
    const changed = current[field] !== original[field];
    row.classList.toggle('changed', changed);
    was.textContent = changed ? `was ${clean(original[field])}` : '';
  };
  slider.oninput = () => { current[field] = clean(fromSlider(Number(slider.value), range)); show(); changedState(); };
  box.onchange = () => { const n = Number(box.value); if (Number.isFinite(n)) current[field] = clean(n); show(); changedState(); };
  row.append(label, slider, box);
  show();
  return row;
}
function checkRow(field) {
  const label = document.createElement('label');
  label.className = 'check';
  const box = document.createElement('input');
  box.type = 'checkbox';
  box.checked = !!current[field];
  box.onchange = () => { current[field] = box.checked; label.classList.toggle('changed', current[field] !== original[field]); changedState(); };
  label.append(box, document.createTextNode(field));
  label.classList.toggle('changed', current[field] !== original[field]);
  return label;
}
function selectRow(field, options) {
  const row = document.createElement('div');
  row.className = 'check';
  const sel = document.createElement('select');
  sel.setAttribute('aria-label', field);
  for (const o of options) sel.add(new Option(o, o));
  sel.value = current[field];
  sel.onchange = () => { current[field] = sel.value; row.classList.toggle('changed', current[field] !== original[field]); changedState(); };
  row.append(document.createTextNode(field), sel);
  return row;
}
function colorsRow() {
  const wrap = document.createElement('div');
  wrap.className = 'colors';
  const render = () => {
    wrap.replaceChildren();
    current.colors.forEach((color, i) => {
      const input = document.createElement('input');
      input.type = 'color';
      input.value = toHex(color);
      input.setAttribute('aria-label', `Color ${i + 1}`);
      input.oninput = () => { current.colors[i] = input.value; mark(); };
      wrap.append(input);
    });
    const add = document.createElement('button');
    add.className = 'small'; add.textContent = '+'; add.disabled = current.colors.length >= 8; add.setAttribute('aria-label', 'Add color');
    add.onclick = () => { current.colors.push(current.colors.at(-1)); render(); mark(); };
    const remove = document.createElement('button');
    remove.className = 'small'; remove.textContent = '−'; remove.disabled = current.colors.length <= 1; remove.setAttribute('aria-label', 'Remove last color');
    remove.onclick = () => { current.colors.pop(); render(); mark(); };
    wrap.append(add, remove);
    mark();
  };
  const mark = () => { wrap.classList.toggle('changed', !same(current.colors, original.colors)); changedState(); };
  render();
  return wrap;
}
function toHex(color) {
  if (/^#[0-9a-f]{6}$/i.test(color)) return color.toLowerCase();
  const probe = document.createElement('canvas').getContext('2d');
  probe.fillStyle = color;
  return probe.fillStyle.startsWith('#') ? probe.fillStyle : '#ffffff';
}

function renderFields() {
  const host = $('fields');
  host.replaceChildren();
  const used = new Set();
  const section = (title, fields) => {
    const el = document.createElement('section');
    const h = document.createElement('h2');
    h.textContent = title;
    el.append(h);
    for (const field of fields) {
      if (!(field in current) && !['kaleidoscopeEnabled', 'kaleidoscopeSegments', 'spinningKaleido'].includes(field)) continue;
      if (!(field in current)) { current[field] = field === 'kaleidoscopeSegments' ? 6 : false; original[field] = current[field]; }
      used.add(field);
      const v = current[field];
      if (field === 'particleLighting') el.append(selectRow(field, LIGHTING));
      else if (typeof v === 'boolean') el.append(checkRow(field));
      else if (typeof v === 'number') el.append(numberRow(field));
    }
    if (el.children.length > 1) host.append(el);
  };
  for (const [title, fields] of GROUPS) section(title, fields);
  const extras = Object.keys(current).filter(f => !used.has(f) && !SKIP.has(f) && (typeof current[f] === 'number' || typeof current[f] === 'boolean'));
  section('Scene-specific', extras);
  const colors = document.createElement('section');
  colors.innerHTML = '<h2>Colors</h2>';
  colors.append(colorsRow());
  host.append(colors);
}

// ---------- music ----------
function renderMusic() {
  const host = $('music');
  host.replaceChildren();
  const params = state.music.params;
  if (!musicCurrent) { host.textContent = 'This shape has no music card.'; $('music-add').disabled = $('music-add-btn').disabled = true; return; }
  const flat = flatten(musicCurrent), base = flatten(musicOriginal);
  for (const p of params) {
    if (!(p.key in flat)) continue;
    const row = document.createElement('div');
    row.className = 'row';
    const label = document.createElement('label');
    label.title = p.hint || '';
    const name = document.createElement('span');
    const was = document.createElement('span');
    name.textContent = p.label;
    was.className = 'was';
    label.append(name, was);
    const slider = document.createElement('input');
    slider.type = 'range'; slider.min = p.min; slider.max = p.max; slider.step = p.step; slider.setAttribute('aria-label', p.label);
    const box = document.createElement('input');
    box.type = 'number'; box.step = p.step; box.setAttribute('aria-label', `${p.label} value`);
    const show = () => {
      const v = flatten(musicCurrent)[p.key];
      slider.value = v; box.value = v;
      const changed = v !== base[p.key];
      row.classList.toggle('changed', changed);
      was.textContent = changed ? `was ${base[p.key] ?? '—'}` : '';
    };
    const set = v => { setFlat(p.key, Math.min(p.max, Math.max(p.min, clean(v)))); show(); musicChanged(); };
    slider.oninput = () => set(Number(slider.value));
    box.onchange = () => Number.isFinite(Number(box.value)) && set(Number(box.value));
    row.append(label, slider, box);
    host.append(row);
    show();
  }
  if (musicCurrent.ripple) {
    for (const [k, choices] of Object.entries(state.music.choices)) {
      const sub = k.slice(7);
      const row = document.createElement('div');
      row.className = 'check';
      const sel = document.createElement('select');
      sel.setAttribute('aria-label', k);
      for (const c of choices) sel.add(new Option(c, c));
      sel.value = musicCurrent.ripple[sub];
      sel.onchange = () => { musicCurrent.ripple[sub] = sel.value; row.classList.toggle('changed', sel.value !== musicOriginal.ripple?.[sub]); musicChanged(); };
      row.classList.toggle('changed', musicCurrent.ripple[sub] !== musicOriginal.ripple?.[sub]);
      row.append(document.createTextNode(k), sel);
      host.append(row);
    }
  }
  const add = $('music-add');
  add.replaceChildren(new Option('Add a music voice…', ''));
  for (const p of params) if (!(p.key in flat)) add.add(new Option(p.label, p.key));
  add.disabled = $('music-add-btn').disabled = add.options.length <= 1;
}
function flatten(prof) {
  const out = {};
  for (const [k, v] of Object.entries(prof || {})) {
    if (k === 'ripple' && v) for (const [rk, rv] of Object.entries(v)) { if (typeof rv === 'number') out['ripple.' + rk] = rv; }
    else if (typeof v === 'number') out[k] = v;
  }
  return out;
}
function setFlat(k, v) {
  if (k.startsWith('ripple.')) { musicCurrent.ripple = musicCurrent.ripple || { amp: 0, dir: 'out', freq: 1, to: 'both' }; musicCurrent.ripple[k.slice(7)] = v; }
  else musicCurrent[k] = v;
}
$('music-add-btn').onclick = () => {
  const k = $('music-add').value;
  if (!k) return;
  const p = state.music.params.find(x => x.key === k);
  setFlat(k, Math.min(p.max, Math.max(p.min, 0)) || p.min);
  renderMusic(); musicChanged();
};
function musicChanged() {
  win()?.MusicMoods?.setProfile?.(musicShape, musicCurrent);
  changedState();
}

// ---------- state ----------
function presetChanges() {
  const out = {};
  for (const [field, value] of Object.entries(current)) if (!same(value, original[field])) out[field] = value;
  return out;
}
function changedState() {
  const n = Object.keys(presetChanges()).length + (musicCurrent && !same(musicCurrent, musicOriginal) ? 1 : 0);
  $('save').disabled = n === 0;
  $('save').textContent = n ? `Save ${n} change${n === 1 ? '' : 's'} as pull request` : 'Save as pull request';
}
function loadKey(next) {
  if (current && Object.keys(presetChanges()).length && !confirm('Discard unsaved changes to this preset?')) { $('preset').value = key; return; }
  key = next;
  const p = state.presets[key];
  original = JSON.parse(JSON.stringify(p));
  current = JSON.parse(JSON.stringify(p));
  musicShape = p.particleShape || 'ellipse';
  musicOriginal = state.music.profiles[musicShape] ? JSON.parse(JSON.stringify(state.music.profiles[musicShape])) : null;
  musicCurrent = musicOriginal ? JSON.parse(JSON.stringify(musicOriginal)) : null;
  renderFields();
  renderMusic();
  changedState();
  status('');
  selectInStage(key);
  if (musicCurrent) win()?.MusicMoods?.setProfile?.(musicShape, musicCurrent);
}
$('preset').onchange = () => loadKey($('preset').value);
$('reset').onclick = () => {
  current = null;
  if (musicOriginal) win()?.MusicMoods?.setProfile?.(musicShape, musicOriginal);
  loadKey(key);
};
$('save').onclick = async () => {
  $('save').disabled = true;
  status('Creating a branch and pull request…');
  try {
    const body = { presetKey: key, presetChanges: presetChanges(), note: $('note').value };
    if (musicCurrent && !same(musicCurrent, musicOriginal)) Object.assign(body, { musicShape, musicProfile: musicCurrent });
    const result = await api('/api/studio/save', body);
    status(`Pull request opened: <a href="${result.url}" target="_blank" rel="noopener">${result.url}</a> — merge it to publish.`);
    state.presets[key] = JSON.parse(JSON.stringify(current));
    if (body.musicProfile) state.music.profiles[musicShape] = JSON.parse(JSON.stringify(musicCurrent));
    original = JSON.parse(JSON.stringify(current));
    musicOriginal = musicCurrent ? JSON.parse(JSON.stringify(musicCurrent)) : null;
    renderFields(); renderMusic(); changedState();
  } catch (error) {
    status(`Couldn't save: ${error.message}`);
    changedState();
  }
};
addEventListener('beforeunload', e => { if (!$('save').disabled) { e.preventDefault(); e.returnValue = ''; } });

(async () => {
  state = await api('/api/studio/state');
  $('branch').textContent = `Previewing branch ${state.branch} · saves go to new pull requests`;
  for (const k of state.order) $('preset').add(new Option(state.presets[k].name, k));
  loadKey(state.order[0]);
  requestAnimationFrame(pinValues);
})().catch(error => status(`Studio failed to load: ${error.message}`));
</script>
</body>
</html>
