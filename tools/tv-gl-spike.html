<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV GL Spike</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; left: 12px; top: 10px; color: #9fe8ff; font: 14px/1.4 monospace; text-shadow: 0 0 4px #000; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<script>
// Feasibility spike for a WebGL TV renderer (not part of the app).
// Draws the expensive parts of Eternal Void the GPU way and measures them:
//   - N glowing, velocity-stretched particles (halo + body + core, like the
//     default "ellipse" particle) in ONE instanced draw call
//   - trails: the previous frame faded on the GPU (ping-pong framebuffers)
//   - kaleidoscope: one full-screen shader pass (polar mirror), not N slices
// Particle physics stays in JS (flow field), uploaded once per frame.
// Controls from DevTools: spike.set({ n, kaleido, segments, res, pace })
// Results: window.spike.stats
"use strict";
const canvas = document.getElementById("c");
// ?alpha=1 / ?preserve=1 to test how the WebView composites the canvas
const q = new URLSearchParams(location.search);
const gl = canvas.getContext("webgl2", { antialias: false, alpha: q.get("alpha") === "1", premultipliedAlpha: q.get("alpha") === "1",
  preserveDrawingBuffer: q.get("preserve") === "1" });
const hud = document.getElementById("hud");

const cfg = { n: 3000, kaleido: false, mesh: true, segments: 6, res: 2, pace: true, fade: 0.06 };

function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs)); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

// --- particles: instanced quads, ellipse glow in the fragment shader -------
const particleProg = program(`#version 300 es
layout(location=0) in vec2 corner;      // -1..1 quad
layout(location=1) in vec4 posVel;      // x, y (css px), vx, vy
layout(location=2) in vec4 colorSize;   // r, g, b, size
uniform vec2 viewport;                  // css px
out vec2 local; out vec3 color; out float alphaMul;
void main() {
  float size = colorSize.w;
  vec2 v = posVel.zw;
  float speed = min(2.5, length(v));
  float stretch = 1.0 + speed * 0.05 * 1.6;
  vec2 dir = speed > 0.0001 ? v / length(v) : vec2(1.0, 0.0);
  vec2 nrm = vec2(-dir.y, dir.x);
  // quad big enough for the outer halo: 2.88 x 1.3 size units (stretched)
  vec2 ext = vec2(size * (2.4 + 1.6 * 0.3), size * (1.1 + stretch * 0.15));
  local = corner * vec2(1.0, 1.0);
  vec2 p = posVel.xy + dir * corner.x * ext.x + nrm * corner.y * ext.y;
  gl_Position = vec4(p / viewport * 2.0 - 1.0, 0.0, 1.0);
  gl_Position.y = -gl_Position.y;
  color = colorSize.rgb; alphaMul = 0.78;
}`, `#version 300 es
precision highp float;
in vec2 local; in vec3 color; in float alphaMul;
out vec4 frag;
// three nested ellipses (halo 0.35, body 0.9, core 0.75) as in Particle.draw
float disc(vec2 p, vec2 r) { float d = length(p / r); return 1.0 - smoothstep(0.86, 1.0, d); }
void main() {
  vec2 p = local;                         // halo fills the quad
  float halo = disc(p, vec2(1.0, 1.0)) * 0.35;
  float body = disc(p, vec2(0.66, 0.6)) * 0.9;
  float core = disc(p - vec2(0.04, 0.0), vec2(0.28, 0.33)) * 0.75;
  float a = 1.0 - (1.0 - halo) * (1.0 - body) * (1.0 - core);
  frag = vec4(color, a * alphaMul);
}`);

// --- full-screen passes ----------------------------------------------------
const quadVS = `#version 300 es
layout(location=0) in vec2 corner; out vec2 uv;
void main() { uv = corner * 0.5 + 0.5; gl_Position = vec4(corner, 0.0, 1.0); }`;
const fadeProg = program(quadVS, `#version 300 es
precision mediump float; in vec2 uv; uniform sampler2D prev; uniform float keep; out vec4 frag;
void main() { frag = vec4(texture(prev, uv).rgb * keep, 1.0); }`);
const presentProg = program(quadVS, `#version 300 es
precision highp float; in vec2 uv; uniform sampler2D scene; uniform float segments; uniform float kaleido;
uniform vec2 aspect; out vec4 frag;
void main() {
  vec2 q = uv;
  if (kaleido > 0.5) {
    vec2 p = (uv - 0.5) * aspect;
    float r = length(p), a = atan(p.y, p.x);
    float slice = 3.14159265 / segments;     // mirror every half-wedge
    a = mod(a, 2.0 * slice); if (a > slice) a = 2.0 * slice - a;
    q = vec2(cos(a), sin(a)) * r / aspect + 0.5;
  }
  frag = texture(scene, q);
}`);

// Kaleidoscope as geometry: 2*segments triangles around the centre, each
// textured with the same base wedge (alternately mirrored). The GPU only
// copies pixels; no per-pixel trigonometry.
const meshProg = program(`#version 300 es
layout(location=0) in vec2 pos; layout(location=1) in vec2 tc; out vec2 uv;
void main() { uv = tc; gl_Position = vec4(pos, 0.0, 1.0); }`, `#version 300 es
precision mediump float; in vec2 uv; uniform sampler2D scene; out vec4 frag;
void main() { frag = texture(scene, uv); }`);
const meshBuf = gl.createBuffer(), meshVAO = gl.createVertexArray();
let meshCount = 0;
function buildMesh() {
  const seg = Math.max(2, Math.round(cfg.segments)), slices = seg * 2, step = Math.PI * 2 / slices;
  const ax = W / Math.min(W, H), ay = H / Math.min(W, H);      // clip space -> square units
  const R = Math.hypot(ax, ay) / Math.cos(step / 2) + 0.01;      // chords still cover the corners
  const data = [];
  const toUV = (a, r) => [0.5 + Math.cos(a) * r / ax * 0.5, 0.5 + Math.sin(a) * r / ay * 0.5];
  for (let k = 0; k < slices; k++) {
    const a0 = k * step, a1 = a0 + step;
    // base wedge angles 0..step; odd slices mirrored
    const b0 = k % 2 ? step : 0, b1 = k % 2 ? 0 : step;
    const v = [[0, 0, 0.5, 0.5],
      [Math.cos(a0) * R / ax, Math.sin(a0) * R / ay, ...toUV(b0, R)],
      [Math.cos(a1) * R / ax, Math.sin(a1) * R / ay, ...toUV(b1, R)]];
    for (const p of v) data.push(...p);
  }
  meshCount = slices * 3;
  gl.bindVertexArray(meshVAO);
  gl.bindBuffer(gl.ARRAY_BUFFER, meshBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 16, 0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 16, 8);
  gl.bindVertexArray(null);
}

const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

const particleVAO = gl.createVertexArray();
const posBuf = gl.createBuffer(), colBuf = gl.createBuffer();
gl.bindVertexArray(particleVAO);
gl.bindBuffer(gl.ARRAY_BUFFER, quad); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.bindBuffer(gl.ARRAY_BUFFER, posBuf); gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 0, 0); gl.vertexAttribDivisor(1, 1);
gl.bindBuffer(gl.ARRAY_BUFFER, colBuf); gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 0, 0); gl.vertexAttribDivisor(2, 1);
gl.bindVertexArray(null);
const quadVAO = gl.createVertexArray();
gl.bindVertexArray(quadVAO);
gl.bindBuffer(gl.ARRAY_BUFFER, quad); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.bindVertexArray(null);

// --- trail framebuffers -----------------------------------------------------
let targets = [], W = 0, H = 0;
function makeTarget(w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  return { tex, fb };
}
function resize() {
  W = Math.round(innerWidth * cfg.res); H = Math.round(innerHeight * cfg.res);
  canvas.width = W; canvas.height = H;
  targets = [makeTarget(W, H), makeTarget(W, H)];
  if (typeof buildMesh === "function") buildMesh();
}

// --- particles (JS physics, like the 2D sim) ------------------------------
let pos, col;
const palette = [[0.55, 0.85, 1.0], [0.75, 0.45, 1.0], [1.0, 0.45, 0.75], [0.35, 1.0, 0.7], [1.0, 0.8, 0.4]];
function spawn() {
  pos = new Float32Array(cfg.n * 4); col = new Float32Array(cfg.n * 4);
  for (let i = 0; i < cfg.n; i++) {
    pos[i * 4] = Math.random() * innerWidth; pos[i * 4 + 1] = Math.random() * innerHeight;
    const c = palette[i % palette.length];
    col[i * 4] = c[0]; col[i * 4 + 1] = c[1]; col[i * 4 + 2] = c[2]; col[i * 4 + 3] = 2.4 + Math.random() * 3;
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, colBuf); gl.bufferData(gl.ARRAY_BUFFER, col, gl.STATIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf); gl.bufferData(gl.ARRAY_BUFFER, pos, gl.DYNAMIC_DRAW);
}
function step(t, dt) {
  const w = innerWidth, h = innerHeight, k = 0.004;
  for (let i = 0; i < cfg.n; i++) {
    const o = i * 4;
    let x = pos[o], y = pos[o + 1];
    // cheap swirling field standing in for curl noise
    const ax = Math.sin(y * k + t * 0.3) + Math.cos((x + y) * k * 0.7 - t * 0.2);
    const ay = Math.cos(x * k - t * 0.25) - Math.sin((x - y) * k * 0.6 + t * 0.15);
    let vx = pos[o + 2] * 0.94 + ax * 0.12, vy = pos[o + 3] * 0.94 + ay * 0.12;
    x += vx * dt; y += vy * dt;
    if (x < 0) x += w; else if (x > w) x -= w;
    if (y < 0) y += h; else if (y > h) y -= h;
    // particles have a life and respawn anywhere, like the app's, so the
    // field can't drain them into a few spots
    if (Math.random() < 0.006 * dt) { x = Math.random() * w; y = Math.random() * h; vx = 0; vy = 0; }
    pos[o] = x; pos[o + 1] = y; pos[o + 2] = vx; pos[o + 3] = vy;
  }
}

// --- frame ------------------------------------------------------------------
let probeNow = false, probeResult = null;
let cur = 0, last = 0, lastDrawn = 0, frames = 0, statT = 0, jsMs = 0, worst = 0, prevDrawn = 0;
const stats = { fps: 0, jsMs: 0, worstMs: 0 };
function frame(now) {
  requestAnimationFrame(frame);
  const t = document.timeline.currentTime;
  if (cfg.pace && t - lastDrawn < 25) return;  // every 2nd refresh at 50/60 Hz
  if (prevDrawn) worst = Math.max(worst, t - prevDrawn);
  prevDrawn = t;
  lastDrawn = t;
  const dt = last ? Math.min(3, (t - last) / 16.67) : 1; last = t;
  const t0 = performance.now();
  step(t / 1000, dt);
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, pos);

  const src = targets[cur], dst = targets[1 - cur];
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb);
  gl.viewport(0, 0, W, H);
  gl.disable(gl.BLEND);
  gl.useProgram(fadeProg);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src.tex);
  gl.uniform1i(gl.getUniformLocation(fadeProg, "prev"), 0);
  gl.uniform1f(gl.getUniformLocation(fadeProg, "keep"), Math.pow(1 - cfg.fade, dt));
  gl.bindVertexArray(quadVAO); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  const probeAt = [Math.round(pos[0] * cfg.res), Math.round(H - pos[1] * cfg.res)];
  const readHere = () => { const px = new Uint8Array(4); gl.readPixels(probeAt[0], probeAt[1], 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); return Array.from(px); };
  let afterFade = null; if (probeNow) afterFade = readHere();

  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(particleProg);
  gl.uniform2f(gl.getUniformLocation(particleProg, "viewport"), innerWidth, innerHeight);
  gl.bindVertexArray(particleVAO); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, cfg.n);
  let afterParticles = null; if (probeNow) afterParticles = readHere();

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.disable(gl.BLEND);
  if (cfg.kaleido && cfg.mesh) {
    gl.useProgram(meshProg);
    gl.bindTexture(gl.TEXTURE_2D, dst.tex);
    gl.uniform1i(gl.getUniformLocation(meshProg, "scene"), 0);
    gl.bindVertexArray(meshVAO); gl.drawArrays(gl.TRIANGLES, 0, meshCount);
  } else {
  gl.useProgram(presentProg);
  gl.bindTexture(gl.TEXTURE_2D, dst.tex);
  gl.uniform1i(gl.getUniformLocation(presentProg, "scene"), 0);
  gl.uniform1f(gl.getUniformLocation(presentProg, "segments"), cfg.segments);
  gl.uniform1f(gl.getUniformLocation(presentProg, "kaleido"), cfg.kaleido ? 1 : 0);
  gl.uniform2f(gl.getUniformLocation(presentProg, "aspect"), W / Math.min(W, H), H / Math.min(W, H));
  gl.bindVertexArray(quadVAO); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  if (probeNow) {
    const at = (x, y) => { const px = new Uint8Array(4); gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); return Array.from(px); };
    const screen = [at(W / 2, H / 2), at(W / 2 + 100, H / 2 + 37), at(100, 100)];
    gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb);
    const sceneCentre = at(W / 2, H / 2);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    probeResult = { afterFade, afterParticles, afterPresent: readHere(), screen, sceneCentre, err: gl.getError() };
    probeNow = false;
  }
  cur = 1 - cur;
  jsMs += performance.now() - t0;

  frames++;
  if (t - statT >= 1000) {
    stats.fps = +(frames * 1000 / (t - statT)).toFixed(1);
    stats.jsMs = +(jsMs / frames).toFixed(1);
    stats.worstMs = Math.round(worst);
    hud.textContent = `${stats.fps} fps  js ${stats.jsMs} ms  worst ${stats.worstMs} ms  n=${cfg.n}  ${W}x${H}${cfg.kaleido ? "  kaleido " + cfg.segments : ""}`;
    frames = 0; jsMs = 0; worst = 0; statT = t;
  }
}

window.spike = {
  stats, cfg,
  set(o) { Object.assign(cfg, o); if ("res" in o) resize(); if ("n" in o) spawn(); if ("segments" in o) buildMesh(); },
  // Mean colour of a 64x64 block in the middle of the trail buffer (debug).
  probe() {
    const t = targets[1 - cur], px = new Uint8Array(64 * 64 * 4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, t.fb);
    gl.readPixels(W / 2 - 32, H / 2 - 32, 64, 64, gl.RGBA, gl.UNSIGNED_BYTE, px);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    let r = 0, g = 0, b = 0; for (let i = 0; i < px.length; i += 4) { r += px[i]; g += px[i + 1]; b += px[i + 2]; }
    const n = px.length / 4;
    return { r: Math.round(r / n), g: Math.round(g / n), b: Math.round(b / n), err: gl.getError(),
      pos0: [pos[0], pos[1], pos[2], pos[3]].map(v => +v.toFixed(2)), renderer: gl.getParameter(gl.RENDERER) };
  },
  probeFrame() { probeNow = true; return new Promise(r => setTimeout(() => r(probeResult), 300)); },
  measure(ms = 4000) { return new Promise(r => setTimeout(() => r({ ...stats, n: cfg.n, res: cfg.res, kaleido: cfg.kaleido, pace: cfg.pace }), ms)); }
};
resize(); spawn(); requestAnimationFrame(frame);
</script>
</body>
</html>
